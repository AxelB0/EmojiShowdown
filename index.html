<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EmojiShowdown</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
<div class="container">
    <div id="heroDiv">
        <!-- code hero -->
        <span id="heroHP">🟩🟩🟩🟩🟩</span>
        <br>
        <span id="hero">😎</span>
    </div>
    <div id="game">
        <!-- code game -->
        <div>
            <h2>Computer</h2>
            <span id="computerChoice">✌️ </span>
        </div>
        <div>
            <h2>Score:</h2>
            <h2 id = "score"></h2>
            <h3 id="gameResult"></h3>

        </div>

        <div id="mijnKeuzes">
            <h2> KIES</h2>
            <button class="mijnKeuze" value="blad">Blad 🤚</button>
            <button class="mijnKeuze" value="steen">Steen ✊</button>
            <button class="mijnKeuze" value="schaar">Schaar ✌️</button>
        </div>
    </div>

    <div id="enemyDiv">
        <!-- code hero -->
        <span id="enemyHP">🟩🟩🟩🟩🟩</span>
        <br>
        <span id="enemy">💀</span>
    </div>

</div>
</body>
</html>
